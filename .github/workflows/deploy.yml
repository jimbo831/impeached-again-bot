name: Test and Deploy

on:
  push:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this branch to the VM (main always deploys)
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Run tests
        run: |
          pip install -q -r requirements.txt
          python -m unittest -v

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' || inputs.deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy source files
        run: |
          scp -i ~/.ssh/deploy_key \
            bot.py requirements.txt \
            ubuntu@${{ secrets.VM_HOST }}:/opt/impeached-again-bot/

      - name: Create .env
        run: |
          printf 'DISCORD_TOKEN=%s\nADMIN_USER_ID=%s\nUPTIME_KUMA_PUSH_URL=%s\n' \
            "${{ secrets.DISCORD_TOKEN }}" \
            "${{ secrets.ADMIN_USER_ID }}" \
            "${{ secrets.UPTIME_KUMA_PUSH_URL }}" | \
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.VM_HOST }} \
            "cat > /opt/impeached-again-bot/.env"

      - name: Install dependencies and restart service
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.VM_HOST }} bash << 'EOF'
            set -e
            cd /opt/impeached-again-bot
            if [ ! -d venv ]; then
              python3.14 -m venv venv
            fi
            venv/bin/pip install -q --upgrade pip
            venv/bin/pip install -q -r requirements.txt
            since=$(date '+%Y-%m-%d %H:%M:%S')
            sudo systemctl restart impeached-again-bot
            for i in $(seq 1 30); do
              if sudo journalctl -u impeached-again-bot --since "$since" | grep -q "Logged in as"; then
                exit 0
              fi
              sleep 1
            done
            echo "Bot did not log in within 30s:"
            sudo journalctl -u impeached-again-bot --since "$since" --no-pager -n 50
            exit 1
          EOF
